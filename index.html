<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f664d">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <title>AutoPay — i20 Active</title>
  <style>
    :root{--ink:#1c2824;--muted:#75817b;--line:#e5e9e3;--paper:#fff;--canvas:#f7f7f2;--green:#1f664d;--green2:#e6f1eb;--red:#a7463d;--red2:#fff0ed;--gold:#f5e8c7;--shadow:0 8px 28px #1a30240b}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:22px 24px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.04em;font-size:19px}.brand img{width:38px;height:38px;border-radius:12px}.right{display:flex;gap:8px;align-items:center}.role-pill{font-size:11px;padding:5px 9px;border-radius:30px;background:var(--green2);color:var(--green);font-weight:700}.button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--ink);font-size:12px;font-weight:650;box-shadow:0 1px 2px #18231a08}.button:hover{border-color:#b9c8bd}.button.primary{background:var(--green);color:#fff;border-color:var(--green)}.button.primary:hover{background:#174f3b}.button.soft{background:var(--green2);border-color:transparent;color:var(--green)}.button.danger{background:var(--red2);border-color:#f2d8d4;color:var(--red)}.button:disabled{opacity:.55;cursor:wait}.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:750;color:var(--muted)}h1{font-size:30px;letter-spacing:-.055em;line-height:1.15;margin:6px 0 0;font-weight:720}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:var(--paper);border:1px solid #e9ece7;border-radius:16px;box-shadow:var(--shadow)}.overview{padding:22px 24px;grid-column:1/-1}.overview-top{display:flex;justify-content:space-between;align-items:start;gap:15px}.car-title{font-size:18px;font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}.balance{text-align:right}.balance strong{font-size:25px;letter-spacing:-.04em;display:block;line-height:1.2}.balance span{font-size:11px;color:var(--muted)}.progress-head{margin:23px 0 9px;display:flex;justify-content:space-between;font-size:12px}.progress-head b{font-weight:700}.track{height:8px;background:#edf0eb;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:var(--green);transition:width .25s}.progress-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.stat{padding-left:16px;border-left:1px solid var(--line)}.stat:first-child{padding-left:0;border-left:0}.stat label{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}.stat strong{font-size:16px;letter-spacing:-.03em}.stat em{font-style:normal;color:var(--green);font-size:10px;display:block;margin-top:2px}.section{padding:19px 20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-title{font-weight:700;font-size:14px}.hint{font-size:11px;color:var(--muted);margin-top:2px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:9px 11px}.check{width:30px;height:30px;border-radius:9px;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:800}.row-name{font-size:12px;font-weight:650}.row-sub{font-size:10px;color:var(--muted);margin-top:2px}.amount{text-align:right;font-size:12px;font-weight:700}.empty{border:1px dashed #dce3dc;border-radius:11px;padding:23px;text-align:center;color:var(--muted);font-size:12px}.schedule{max-height:350px;overflow:auto}.schedule-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;padding:8px 1px;border-bottom:1px solid #f0f2ee}.schedule-row:last-child{border:0}.index{height:24px;width:24px;border-radius:8px;background:#f3f4f0;display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:700}.schedule-label{font-size:11px;font-weight:650}.schedule-date{font-size:10px;color:var(--muted)}.note{margin-top:13px;background:#f7f8f4;border-radius:9px;padding:10px 11px;color:var(--muted);font-size:10px}.banner{padding:11px 13px;border-radius:10px;background:#eef5f0;color:#315f48;font-size:12px;margin:0 0 14px}.banner.warn{background:#fff8e8;color:#78541a}.banner.error{background:var(--red2);color:var(--red)}.login-wrap{max-width:480px;margin:40px auto}.login-card{padding:24px}.login-card h2{margin:0;font-size:20px;letter-spacing:-.04em}.login-card p{margin:5px 0 17px;color:var(--muted);font-size:12px}.login-actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:11px;color:#66736c;font-weight:650}.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;outline:none;color:var(--ink);background:white}.field input:focus,.field textarea:focus{border-color:#6f9a7e;box-shadow:0 0 0 3px #e5f0e7}.field small{font-size:10px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#17231f70;display:none;place-items:center;padding:16px;z-index:3}.modal-backdrop.open{display:grid}.modal{background:#fff;border-radius:17px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 22px 80px #0e211a38}.modal h2{margin:0;font-size:20px;letter-spacing:-.04em}.modal p{margin:6px 0 16px;font-size:12px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.receipt{max-width:100%;max-height:50vh;display:block;margin:12px auto;border-radius:10px;border:1px solid var(--line)}.pending-card{padding:14px;border:1px solid #e8eade;border-radius:12px}.pending-top{display:flex;justify-content:space-between;gap:10px}.pending-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.badge{font-size:10px;padding:4px 7px;border-radius:30px;background:var(--gold);color:#795b1c;font-weight:700}.approved-badge{background:var(--green2);color:var(--green)}.audit{display:grid;gap:7px;max-height:350px;overflow:auto}.audit-row{padding:9px 10px;border-left:2px solid #dce8df;background:#fafbf8;border-radius:0 8px 8px 0}.audit-main{font-size:11px;font-weight:650}.audit-sub{font-size:10px;color:var(--muted);margin-top:2px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);opacity:0;background:#203c30;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;transition:.2s;pointer-events:none;z-index:5;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
    @media(max-width:760px){.shell{padding:15px 14px 34px}.topbar{margin-bottom:23px}.role-pill{display:none}.heading{align-items:start;gap:10px}.heading h1{font-size:26px}.grid{grid-template-columns:1fr}.overview{grid-column:auto;padding:18px}.section{padding:17px}.stats{grid-template-columns:repeat(2,1fr);row-gap:12px}.stat{padding-left:10px}.stat:nth-child(odd){padding-left:0;border-left:0}.stat:nth-child(n+3){padding-top:10px;border-top:1px solid var(--line)}.stat strong{font-size:14px}.balance strong{font-size:23px}.button{padding:9px 10px}.right{gap:5px}.modal-grid{grid-template-columns:1fr}.full{grid-column:auto}.progress-head{margin-top:20px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><img src="./assets/icon.svg" alt=""><span>autopay</span></div>
      <div class="right"><span class="role-pill hidden" id="rolePill"></span><button class="button hidden" id="notifyBtn">Enable notifications</button><button class="button hidden" id="installBtn">Add to phone</button><button class="button hidden" id="logoutBtn">Sign out</button></div>
    </header>
    <main id="root"></main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{
    const API_BASE='https://i20-installments-api.anunay117.workers.dev';
    const HOME='/i20-installment-tracker/';
    const SESSION_KEY='autopay-cloud-session-v1';
    const $=id=>document.getElementById(id);
    let session=localStorage.getItem(SESSION_KEY)||'';
    let appState=null,installPrompt=null,toastTimer=null;
    const money=n=>'₹'+Math.max(0,Math.round(Number(n)||0)).toLocaleString('en-IN');
    const dateFmt=(s,options={day:'numeric',month:'short',year:'numeric'})=>{if(!s)return '—';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',options)};
    const addMonths=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,1);dt.setMonth(dt.getMonth()+n);dt.setDate(Math.min(d,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()));return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    async function api(path,{method='GET',body}={}){
      if(API_BASE.includes('REPLACE-WITH-WORKERS-SUBDOMAIN'))throw new Error('Cloud database is not connected yet.');
      const response=await fetch(`${API_BASE}/api/${path}`,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),...(session?{Authorization:`Bearer ${session}`}:{})},body:body?JSON.stringify(body):undefined});
      const data=await response.json().catch(()=>({}));
      if(!response.ok){if(response.status===401){localStorage.removeItem(SESSION_KEY);session='';}throw new Error(data.error||'The request could not be completed.');}
      return data;
    }
    async function refresh(){try{appState=await api('status');renderApp()}catch(error){if(session){session='';localStorage.removeItem(SESSION_KEY);}renderLogin(error.message)}}
    function renderLogin(errorMessage=''){
      $('rolePill').classList.add('hidden');$('notifyBtn').classList.add('hidden');$('logoutBtn').classList.add('hidden');
      const invite=new URLSearchParams(location.search).get('invite');
      $('root').innerHTML=`${errorMessage?`<div class="banner error">${escapeHtml(errorMessage)}</div>`:''}<section class="login-wrap"><div class="card login-card"><div class="eyebrow">Secure shared tracker</div><h2>${invite?'Accept your invite':'Sign in to AutoPay'}</h2><p>${invite?'You can accept this earlier invite or sign in with the permanent friend code.':'Use your permanent access code. Access codes do not expire.'}</p><div class="field"><label for="ownerCode">Owner access code</label><input id="ownerCode" type="password" autocomplete="current-password" placeholder="Anunay enters his code"></div><div class="field"><label for="ownerName">Your name</label><input id="ownerName" value="Anunay" maxlength="50"></div><div class="login-actions"><button class="button primary" id="ownerLoginBtn">Continue as owner</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="field"><label for="friendCode">Friend access code</label><input id="friendCode" type="password" autocomplete="current-password" placeholder="Enter the code Anunay shared"></div><div class="field"><label for="friendName">Your name</label><input id="friendName" value="Miti" maxlength="50" readonly></div><div class="login-actions"><button class="button soft" id="friendLoginBtn">Continue as friend</button>${invite?'<button class="button" id="claimBtn">Accept earlier invite</button>':''}</div><p class="hint" style="margin-top:14px">Friend access code can be reused and does not expire. Anyone who has it can sign in as the friend.</p></div></section>`;
      $('ownerLoginBtn').addEventListener('click',()=>loginWithCode('owner'));
      $('friendLoginBtn').addEventListener('click',()=>loginWithCode('friend'));
      if(invite)$('claimBtn').addEventListener('click',claimFriend);
    }
    async function loginWithCode(role){const button=$(role==='owner'?'ownerLoginBtn':'friendLoginBtn');button.disabled=true;try{const data=await api('login',{method:'POST',body:{role,code:$(role==='owner'?'ownerCode':'friendCode').value,displayName:role==='owner'?$('ownerName').value:$('friendName').value}});session=data.token;localStorage.setItem(SESSION_KEY,session);history.replaceState(null,'',HOME);await refresh()}catch(error){toast(error.message);button.disabled=false}}
    async function setupOwner(){const button=$('setupBtn');button.disabled=true;try{const data=await api('setup',{method:'POST',body:{bootstrapToken:$('setupCode').value,displayName:$('ownerName').value}});session=data.token;localStorage.setItem(SESSION_KEY,session);history.replaceState(null,'',HOME);await refresh()}catch(error){toast(error.message);button.disabled=false}}
    async function claimFriend(){const button=$('claimBtn');button.disabled=true;try{const inviteToken=new URLSearchParams(location.search).get('invite');const data=await api('claim-invite',{method:'POST',body:{inviteToken,displayName:$('friendName').value}});session=data.token;localStorage.setItem(SESSION_KEY,session);history.replaceState(null,'',HOME);await refresh()}catch(error){toast(error.message);button.disabled=false}}
    function renderApp(){
      const {actor,plan,summary,payments,pendingPayments,audit}=appState;
      $('rolePill').textContent=actor.role==='owner'?'Anunay · Owner':`${actor.displayName} · Friend`;$('rolePill').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('notifyBtn').classList.remove('hidden');
      const paid=summary.approved,remaining=summary.balance,planCount=summary.plannedInstallments,left=Math.max(0,planCount-summary.paidInstallments),percent=summary.principal?Math.min(100,paid/summary.principal*100):0;
      const schedule=[];for(let j=0;j<Math.min(left,12);j++){const number=summary.paidInstallments+j+1;const amount=j===left-1&&summary.principal-paid-j*plan.monthly_installment<plan.monthly_installment?summary.principal-paid-j*plan.monthly_installment:plan.monthly_installment;schedule.push(`<div class="schedule-row"><div class="index">${number}</div><div><div class="schedule-label">Installment ${number}</div><div class="schedule-date">Due ${dateFmt(addMonths(plan.first_installment_date,number-1))}</div></div><div class="amount">${money(amount)}</div></div>`)}
      if(left>12)schedule.push(`<div class="hint" style="padding:9px 0">+ ${left-12} more installments</div>`);
      const approvedRows=payments.length?payments.map((p,i)=>`<div class="row"><div class="check">✓</div><div><div class="row-name">Installment ${summary.paidInstallments-i}</div><div class="row-sub">Received ${dateFmt(p.paid_at)} · Approved by ${escapeHtml(p.reviewed_name||'Anunay')}</div></div><div class="amount">${money(p.amount)}</div></div>`).join(''):`<div class="empty">No approved EMI payments yet.</div>`;
      const pendingRows=pendingPayments.length?pendingPayments.map(p=>{const reviewState=p.status==='rejected'?`<span class="badge" style="background:var(--red2);color:var(--red)">Needs update</span>`:`<span class="badge ${p.status==='approved'?'approved-badge':''}">${actor.role==='owner'?'Needs review':'Awaiting approval'}</span>`;const note=p.review_note?`<div class="banner error" style="margin-top:9px">${escapeHtml(p.review_note)}</div>`:'';return `<div class="pending-card" data-payment-id="${p.id}"><div class="pending-top"><div><div class="row-name">${escapeHtml(p.submitted_name||actor.displayName)} submitted ${money(p.amount)}</div><div class="row-sub">Payment date: ${dateFmt(p.paid_at)} · Submitted ${dateFmt(p.submitted_at)}</div></div>${reviewState}</div>${note}${actor.role==='owner'?`<button class="button soft receiptBtn" data-id="${p.id}" style="margin-top:10px">View screenshot</button><div class="receiptSlot" id="receipt-${p.id}"></div><div class="pending-actions"><button class="button primary approveBtn" data-id="${p.id}">Approve EMI</button><button class="button danger rejectBtn" data-id="${p.id}">Request changes</button></div>`:''}</div>`}).join(''):`<div class="empty">${actor.role==='owner'?'No payments waiting for approval.':'No EMI submissions are waiting for review.'}</div>`;
      const myPending=pendingPayments.length?`<div class="banner warn">${pendingPayments.length} payment${pendingPayments.length===1?'':'s'} awaiting Anunay’s review. They are not included in the approved total yet.</div>`:'';
      const historyRows=actor.role==='owner'?audit.length?audit.map(event=>`<div class="audit-row"><div class="audit-main">${escapeHtml(event.actor_name)} · ${escapeHtml(event.action.replaceAll('_',' '))}</div><div class="audit-sub">${escapeHtml(event.entity_type)}${event.entity_id?` ${escapeHtml(event.entity_id.slice(0,12))}`:''} · ${new Date(event.occurred_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div>`).join(''):`<div class="empty">Audit history will appear here.</div>`:'';
      $('root').innerHTML=`<div id="message"></div><div class="heading"><div><div class="eyebrow">Shared payment tracker</div><h1>Car installment plan</h1><p class="subtitle">EMI submissions are recorded with a screenshot and added to the balance after Anunay approves them.</p></div>${actor.role==='friend'?'<button class="button primary" id="payBtn">＋ Pay EMI</button>':'<div class="right"><button class="button soft" id="codesBtn">Access codes</button><button class="button" id="editPlanBtn">Edit plan</button></div>'}</div>${myPending}<div class="grid"><section class="card overview"><div class="overview-top"><div><div class="car-title">${escapeHtml(plan.car_name)}</div><div class="meta">${planCount} monthly installments · First installment ${dateFmt(plan.first_installment_date)}</div></div><div class="balance"><strong>${money(remaining)}</strong><span>remaining to pay after approved EMIs</span></div></div><div class="progress-head"><b>${summary.paidInstallments} of ${planCount} installments paid</b><span>${Math.round(percent)}%</span></div><div class="track"><div class="fill" style="width:${percent}%"></div></div><div class="progress-foot"><span>${money(paid)} approved</span><span>${money(summary.principal)} after down payment</span></div><div class="stats"><div class="stat"><label>Agreed car price</label><strong>${money(plan.sale_price)}</strong></div><div class="stat"><label>Monthly installment</label><strong>${money(plan.monthly_installment)}</strong></div><div class="stat"><label>Installments left</label><strong>${left}</strong></div><div class="stat"><label>Down payment</label><strong>${money(plan.down_payment)}</strong><em>Received ${dateFmt(plan.down_payment_date)}</em></div></div></section><section class="card section"><div class="section-head"><div><div class="section-title">${actor.role==='owner'?'Payment approvals':'Your submissions'}</div><div class="hint">${actor.role==='owner'?'Check each screenshot before approving.':'Approved payments appear in the payment history.'}</div></div></div><div class="list">${actor.role==='owner'?pendingRows:pendingRows}</div></section><section class="card section"><div class="section-head"><div><div class="section-title">Approved payment history</div><div class="hint">Only approved EMI payments reduce the balance.</div></div></div><div class="list">${approvedRows}</div></section><section class="card section"><div class="section-head"><div><div class="section-title">Remaining schedule</div><div class="hint">Installment due dates</div></div></div><div class="schedule">${schedule.join('')||'<div class="empty">All installments are paid.</div>'}</div><div class="note">A pending payment is not counted as paid until Anunay approves it. Receipt screenshots are stored in the private Cloudflare database.</div></section>${actor.role==='owner'?`<section class="card section" style="grid-column:1/-1"><div class="section-head"><div><div class="section-title">Activity and audit history</div><div class="hint">Recorded changes and approval actions · latest 100</div></div></div><div class="audit">${historyRows}</div></section>`:''}</div>`;
      $('notifyBtn').textContent=Notification.permission==='granted'?'Notifications enabled':'Enable notifications';
      if(actor.role==='friend')$('payBtn').addEventListener('click',openPayModal);
      if(actor.role==='owner'){$('codesBtn').addEventListener('click',openAccessCodesModal);$('editPlanBtn').addEventListener('click',openPlanModal);}
      document.querySelectorAll('.receiptBtn').forEach(button=>button.addEventListener('click',()=>showReceipt(button.dataset.id)));
      document.querySelectorAll('.approveBtn').forEach(button=>button.addEventListener('click',()=>reviewPayment(button.dataset.id,'approve')));
      document.querySelectorAll('.rejectBtn').forEach(button=>button.addEventListener('click',()=>reviewPayment(button.dataset.id,'reject')));
    }
    function modalOpen(markup){$('modal').innerHTML=markup;$('modalBackdrop').classList.add('open')}
    function modalClose(){$('modalBackdrop').classList.remove('open')}
    $('modalBackdrop').addEventListener('click',event=>{if(event.target===$('modalBackdrop'))modalClose()});
    function openPayModal(){modalOpen(`<h2>Pay EMI</h2><p>Record an EMI you have already paid to Anunay. It will be added to the tracker after he approves the screenshot.</p><form id="payForm"><div class="modal-grid"><div class="field"><label for="amountInput">Amount paid (₹)</label><input id="amountInput" type="number" min="1" step="1" required placeholder="15000"></div><div class="field"><label for="paidAtInput">Payment date</label><input id="paidAtInput" type="date" required value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}"></div><div class="field full"><label for="receiptInput">Payment screenshot</label><input id="receiptInput" type="file" accept="image/png,image/jpeg,image/webp" required><small>Choose a clear screenshot. The app resizes it before uploading, up to 1.2 MB.</small><img class="receipt hidden" id="receiptPreview" alt="Screenshot preview"></div></div><div class="modal-actions"><button class="button" type="button" id="cancelPay">Cancel</button><button class="button primary" type="submit" id="submitPay">Submit for approval</button></div></form>`);$('cancelPay').addEventListener('click',modalClose);$('receiptInput').addEventListener('change',previewReceipt);$('payForm').addEventListener('submit',submitPayment)}
    async function previewReceipt(){const file=$('receiptInput').files?.[0];const image=$('receiptPreview');if(!file){image.classList.add('hidden');return}const data=await compressImage(file);image.src=data;image.classList.remove('hidden')}
    async function compressImage(file){const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();const scale=Math.min(1,1600/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let quality=.82,data=canvas.toDataURL('image/jpeg',quality);while(data.length>1_550_000&&quality>.4){quality-=.08;data=canvas.toDataURL('image/jpeg',quality)}if(data.length>1_550_000)throw new Error('This screenshot is still too large. Choose a smaller image.');return data}finally{URL.revokeObjectURL(url)}}
    async function submitPayment(event){event.preventDefault();const button=$('submitPay');button.disabled=true;try{const file=$('receiptInput').files?.[0];if(!file)throw new Error('Choose a payment screenshot.');const receipt=await compressImage(file);await api('payments',{method:'POST',body:{amount:Number($('amountInput').value),paidAt:$('paidAtInput').value,receipt}});modalClose();await refresh();toast('Payment submitted. Anunay will review it.')}catch(error){toast(error.message);button.disabled=false}}
    async function showReceipt(id){const slot=$(`receipt-${id}`);slot.innerHTML='<div class="hint">Loading screenshot…</div>';try{const data=await api(`payments/${id}/receipt`);slot.innerHTML=`<img class="receipt" src="${data.receipt}" alt="Payment screenshot">`}catch(error){slot.innerHTML=`<div class="banner error">${escapeHtml(error.message)}</div>`}}
    async function reviewPayment(id,action){let note='';if(action==='reject'){note=prompt('What should your friend correct?','Please send a clearer payment screenshot.');if(!note)return}try{await api(`payments/${id}/${action}`,{method:'POST',body:{note}});await refresh();toast(action==='approve'?'EMI approved and added to the tracker.':'Correction requested. Your friend will be notified.')}catch(error){toast(error.message)}}
    function openAccessCodesModal(){modalOpen(`<h2>Permanent access codes</h2><p>Set both codes here. They do not expire. Anyone with the friend code can sign in as the friend. Codes are stored as protected hashes and cannot be displayed again.</p><form id="codesForm"><div class="field"><label for="ownerCodeEdit">Your owner code</label><input id="ownerCodeEdit" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="At least 8 characters"></div><div class="field"><label for="ownerCodeConfirm">Confirm owner code</label><input id="ownerCodeConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><div class="field"><label for="friendCodeEdit">Friend code</label><input id="friendCodeEdit" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Choose a different code"></div><div class="field"><label for="friendCodeConfirm">Confirm friend code</label><input id="friendCodeConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><div class="modal-actions"><button type="button" class="button" id="cancelCodes">Cancel</button><button class="button primary" type="submit" id="saveCodes">Save permanent codes</button></div></form>`);$('cancelCodes').addEventListener('click',modalClose);$('codesForm').addEventListener('submit',saveAccessCodes)}
    async function saveAccessCodes(event){event.preventDefault();const ownerCode=$('ownerCodeEdit').value,friendCode=$('friendCodeEdit').value;if(ownerCode!==$('ownerCodeConfirm').value||friendCode!==$('friendCodeConfirm').value){toast('The code confirmations do not match.');return}const button=$('saveCodes');button.disabled=true;try{await api('access-codes',{method:'POST',body:{ownerCode,friendCode}});modalClose();toast('Permanent access codes saved. Keep them private.')}catch(error){toast(error.message);button.disabled=false}}
    function openPlanModal(){const p=appState.plan;modalOpen(`<h2>Edit plan</h2><p>Plan changes are recorded in the audit history.</p><form id="planForm"><div class="modal-grid"><div class="field full"><label for="carNameEdit">Car name</label><input id="carNameEdit" value="${escapeHtml(p.car_name)}" maxlength="50"></div><div class="field"><label for="priceEdit">Agreed car price (₹)</label><input id="priceEdit" type="number" value="${p.sale_price}" min="0" required></div><div class="field"><label for="downEdit">Down payment (₹)</label><input id="downEdit" type="number" value="${p.down_payment}" min="0" required></div><div class="field"><label for="downDateEdit">Down payment date</label><input id="downDateEdit" type="date" value="${p.down_payment_date}" required></div><div class="field"><label for="monthlyEdit">Monthly installment (₹)</label><input id="monthlyEdit" type="number" value="${p.monthly_installment}" min="1" required></div><div class="field full"><label for="firstDateEdit">First installment date</label><input id="firstDateEdit" type="date" value="${p.first_installment_date}" required></div></div><div class="modal-actions"><button type="button" class="button" id="cancelPlan">Cancel</button><button class="button primary" type="submit" id="savePlan">Save plan</button></div></form>`);$('cancelPlan').addEventListener('click',modalClose);$('planForm').addEventListener('submit',savePlan)}
    async function savePlan(event){event.preventDefault();const button=$('savePlan');button.disabled=true;try{await api('plan',{method:'POST',body:{carName:$('carNameEdit').value,salePrice:Number($('priceEdit').value),downPayment:Number($('downEdit').value),downPaymentDate:$('downDateEdit').value,monthlyInstallment:Number($('monthlyEdit').value),firstInstallmentDate:$('firstDateEdit').value}});modalClose();await refresh();toast('Plan updated and added to the audit log.')}catch(error){toast(error.message);button.disabled=false}}
    function decodeKey(value){const raw=atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
    async function enableNotifications(){if(!('serviceWorker'in navigator)||!('PushManager'in window)){toast('This browser does not support web push.');return}try{if(!window.matchMedia('(display-mode: standalone)').matches&&/iPhone|iPad|iPod/.test(navigator.userAgent)){toast('On iPhone, add AutoPay to the Home Screen before enabling notifications.');return}const permission=await Notification.requestPermission();if(permission!=='granted'){toast('Notifications were not enabled.');return}const keyData=await api('push-key');if(!keyData.publicKey)throw new Error('Push notifications are not configured yet.');const registration=await navigator.serviceWorker.register('./sw.js',{scope:HOME});await navigator.serviceWorker.ready;let subscription=await registration.pushManager.getSubscription();if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(keyData.publicKey)});await api('push-subscriptions',{method:'POST',body:subscription.toJSON()});$('notifyBtn').textContent='Notifications enabled';toast('This phone will receive AutoPay notifications.')}catch(error){toast(error.message)}}
    async function installApp(){if(installPrompt){installPrompt.prompt();installPrompt=null;return}toast('In Chrome, open the menu and choose “Add to Home screen”.')}
    $('notifyBtn').addEventListener('click',enableNotifications);$('installBtn').addEventListener('click',installApp);$('logoutBtn').addEventListener('click',()=>{session='';localStorage.removeItem(SESSION_KEY);appState=null;renderLogin('You have signed out.')});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;$('installBtn').classList.remove('hidden')});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:HOME}).catch(()=>{});
    if(session)refresh();else renderLogin();
    setInterval(()=>{if(session&&document.visibilityState==='visible')refresh()},45000);
  })();
  </script>
